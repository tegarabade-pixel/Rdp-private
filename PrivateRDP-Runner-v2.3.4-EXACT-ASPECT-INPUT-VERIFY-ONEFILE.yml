name: PrivateRDP v2.3.4 EXACT-ASPECT INPUT-VERIFY

on:
  workflow_dispatch:
    inputs:
      room_code:
        description: "Room code (same as Android)"
        required: false
        default: "PRIVATE-RDP-2026"
      width:
        description: "Encoded/fullscreen width (supplied phone viewport measured as 1612)"
        required: false
        default: "1612"
      height:
        description: "Encoded/fullscreen height"
        required: false
        default: "720"
      fps:
        description: "Target FPS (15-60)"
        required: false
        default: "60"
      bitrate_mbps:
        description: "H264 bitrate Mbps (hard max 10)"
        required: false
        default: "5.0"

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RDP_SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
    steps:
      - name: Join Runner to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest
          log-mode: quiet

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install v2 runtime
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python -m pip install --upgrade pip
          python -m pip install "websockets>=14,<16" "numpy>=2,<3" "mss==10.2.0" "dxcam[winrt]==0.3.0" "av>=14,<17" "soundcard==0.4.5"
          try { Set-Service AudioEndpointBuilder -StartupType Automatic; Start-Service AudioEndpointBuilder } catch { Write-Host "AudioEndpointBuilder start non-fatal: $_" }
          try { Set-Service Audiosrv -StartupType Automatic; Start-Service Audiosrv } catch { Write-Host "Windows Audio start non-fatal: $_" }
          python -c "import av; c=av.CodecContext.create('libx264','w'); print('libx264 encoder:', c.name)"

      - name: Resolve Tailscale address and firewall
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ip=(tailscale ip -4 | Select-Object -First 1).Trim()
          if(-not $ip.StartsWith('100.')){ throw "No Tailscale IPv4: $ip" }
          "RDP_TAILSCALE_IP=$ip" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Runner Tailscale IP: $ip"
          'PrivateRDP v2 UDP','PrivateRDP v2 CONTROL','PrivateRDP v2 VIDEO','PrivateRDP v2 AUDIO' | ForEach-Object { Remove-NetFirewallRule -DisplayName $_ -ErrorAction SilentlyContinue }
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 UDP' -Direction Inbound -Action Allow -Protocol UDP -LocalPort 49100 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 CONTROL' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49101 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 VIDEO' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49102 -RemoteAddress '100.64.0.0/10' | Out-Null
          New-NetFirewallRule -DisplayName 'PrivateRDP v2 AUDIO' -Direction Inbound -Action Allow -Protocol TCP -LocalPort 49103 -RemoteAddress '100.64.0.0/10' | Out-Null
          tailscale status
          try { tailscale netcheck } catch { Write-Host 'tailscale netcheck unavailable (non-fatal)' }

      - name: Match Windows desktop to phone aspect (no stretch, no crop)
        shell: pwsh
        env:
          TARGET_W: ${{ inputs.width }}
          TARGET_H: ${{ inputs.height }}
        run: |
          $ErrorActionPreference='Stop'
          $tw=[int]$env:TARGET_W; $th=[int]$env:TARGET_H
          if(($tw -band 1) -ne 0 -or ($th -band 1) -ne 0){ throw 'H264 4:2:0 target dimensions must be even' }

          Add-Type -TypeDefinition @'
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Threading;

          public static class PRDPDisplay {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE {
              public int cb;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string DeviceName;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceString;
              public int StateFlags;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceID;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceKey;
            }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra;
              public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput;
              public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency;
              public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight;
            }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string lpDevice,uint iDevNum,ref DISPLAY_DEVICE lpDisplayDevice,uint dwFlags);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string lpszDeviceName,int iModeNum,ref DEVMODE lpDevMode,uint dwFlags);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string lpszDeviceName,ref DEVMODE lpDevMode,IntPtr hwnd,uint dwflags,IntPtr lParam);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string lpszDeviceName,IntPtr lpDevMode,IntPtr hwnd,uint dwflags,IntPtr lParam);
            const int ENUM_CURRENT_SETTINGS=-1;
            const int ATTACHED=0x1, PRIMARY=0x4;
            const int DM_POSITION=0x20, DM_DISPLAYFREQUENCY=0x400000, DM_PELSWIDTH=0x80000, DM_PELSHEIGHT=0x100000;
            const uint CDS_UPDATEREGISTRY=0x1, CDS_TEST=0x2, CDS_SET_PRIMARY=0x10, CDS_NORESET=0x10000000;
            static DEVMODE FreshMode(){ var d=new DEVMODE(); d.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE)); return d; }
            static DISPLAY_DEVICE FreshDev(){ var d=new DISPLAY_DEVICE(); d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE)); return d; }

            static List<DISPLAY_DEVICE> Devices(bool attachedOnly) {
              var r=new List<DISPLAY_DEVICE>();
              for(uint i=0;i<32;i++){ var d=FreshDev(); if(!EnumDisplayDevices(null,i,ref d,0)) break; if(!attachedOnly || (d.StateFlags&ATTACHED)!=0) r.Add(d); }
              return r;
            }
            static bool Current(string name,out DEVMODE m){ m=FreshMode(); return EnumDisplaySettingsEx(name,ENUM_CURRENT_SETTINGS,ref m,0); }
            static List<DEVMODE> Modes(string name){
              var r=new List<DEVMODE>();
              for(int i=0;i<2048;i++){ var d=FreshMode(); if(!EnumDisplaySettingsEx(name,i,ref d,0)) break; if(d.dmPelsWidth>=640&&d.dmPelsHeight>=360) r.Add(d); }
              return r;
            }
            static bool FindMode(string name,int w,int h,out DEVMODE best){
              best=FreshMode(); int hz=-1;
              foreach(var m in Modes(name)) if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&m.dmDisplayFrequency>hz){best=m;hz=m.dmDisplayFrequency;}
              return hz>=0;
            }
            public static string Snapshot(){
              var a=new List<string>();
              foreach(var d in Devices(true)){ DEVMODE m; if(Current(d.DeviceName,out m)) a.Add($"{((d.StateFlags&PRIMARY)!=0?"*":" ")}{d.DeviceName} '{d.DeviceString}' {m.dmPelsWidth}x{m.dmPelsHeight}@{m.dmDisplayFrequency} pos={m.dmPositionX},{m.dmPositionY}"); }
              return String.Join(" | ",a.ToArray());
            }
            static int ApplySingle(string name,ref DEVMODE m,uint flags){
              m.dmFields |= DM_PELSWIDTH|DM_PELSHEIGHT|DM_POSITION;
              if(m.dmDisplayFrequency>0) m.dmFields |= DM_DISPLAYFREQUENCY;
              return ChangeDisplaySettingsEx(name,ref m,IntPtr.Zero,flags,IntPtr.Zero);
            }
            public static string TryPrimaryExact(int w,int h){
              foreach(var d in Devices(true)) if((d.StateFlags&PRIMARY)!=0){
                DEVMODE m; if(!FindMode(d.DeviceName,w,h,out m)) return "primary-exact-unavailable";
                DEVMODE test=m; int tr=ChangeDisplaySettingsEx(d.DeviceName,ref test,IntPtr.Zero,CDS_TEST,IntPtr.Zero); if(tr!=0) return "primary-exact-test="+tr;
                DEVMODE apply=m; int ar=ApplySingle(d.DeviceName,ref apply,CDS_UPDATEREGISTRY); Thread.Sleep(1200);
                return $"primary-exact result={ar} snapshot={Snapshot()}";
              }
              return "no-primary";
            }
            public static string TryPrimarySameAspect(int w,int h,double tolerance){
              double target=(double)w/h;
              foreach(var d in Devices(true)) if((d.StateFlags&PRIMARY)!=0){
                DEVMODE chosen=FreshMode(); double best=999; bool have=false;
                foreach(var m in Modes(d.DeviceName)){ double err=Math.Abs(((double)m.dmPelsWidth/m.dmPelsHeight)-target)/target; if(err<=tolerance){ double score=Math.Abs(m.dmPelsWidth-w)+Math.Abs(m.dmPelsHeight-h); if(!have||score<best){chosen=m;best=score;have=true;} } }
                if(!have) return "primary-same-aspect-unavailable";
                int ar=ApplySingle(d.DeviceName,ref chosen,CDS_UPDATEREGISTRY); Thread.Sleep(1200);
                return $"primary-same-aspect {chosen.dmPelsWidth}x{chosen.dmPelsHeight} result={ar} snapshot={Snapshot()}";
              }
              return "no-primary";
            }
            public static string MakeExactPrimary(int w,int h){
              // Prefer a virtual display when present; otherwise any attached display exposing exact mode.
              var devs=Devices(true); devs.Sort((a,b)=>{
                Func<DISPLAY_DEVICE,int> rank=x=>((x.DeviceString??"").ToLowerInvariant().Contains("virtual")||(x.DeviceString??"").ToLowerInvariant().Contains("mtt"))?0:1;
                return rank(a).CompareTo(rank(b));
              });
              DISPLAY_DEVICE target=new DISPLAY_DEVICE(); DEVMODE tm=FreshMode(); bool found=false;
              foreach(var d in devs){ DEVMODE m; if(FindMode(d.DeviceName,w,h,out m)){target=d;tm=m;found=true;break;} }
              if(!found) return "exact-mode-not-exposed snapshot="+Snapshot();

              DEVMODE test=tm; int tr=ChangeDisplaySettingsEx(target.DeviceName,ref test,IntPtr.Zero,CDS_TEST,IntPtr.Zero); if(tr!=0) return "exact-test="+tr+" device="+target.DeviceName;

              DEVMODE oldTarget; if(!Current(target.DeviceName,out oldTarget)) return "target-current-failed";
              int shiftX=oldTarget.dmPositionX, shiftY=oldTarget.dmPositionY;
              foreach(var d in Devices(true)){
                if(d.DeviceName==target.DeviceName) continue;
                DEVMODE m; if(!Current(d.DeviceName,out m)) continue;
                m.dmPositionX -= shiftX; m.dmPositionY -= shiftY;
                int r=ApplySingle(d.DeviceName,ref m,CDS_UPDATEREGISTRY|CDS_NORESET);
                if(r!=0) return "reposition-failed="+r+" device="+d.DeviceName;
              }
              tm.dmPositionX=0; tm.dmPositionY=0;
              int rr=ApplySingle(target.DeviceName,ref tm,CDS_UPDATEREGISTRY|CDS_NORESET|CDS_SET_PRIMARY);
              if(rr!=0) return "set-primary-stage="+rr+" device="+target.DeviceName;
              int commit=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);
              Thread.Sleep(2000);
              return $"exact-primary device={target.DeviceName} '{target.DeviceString}' stage={rr} commit={commit} snapshot={Snapshot()}";
            }
            public static string BestPrimary(int tw,int th){
              double ta=(double)tw/th;
              foreach(var d in Devices(true)) if((d.StateFlags&PRIMARY)!=0){
                var modes=Modes(d.DeviceName);
                modes.Sort((a,b)=>{
                  Func<DEVMODE,double> score=x=>Math.Abs(((double)x.dmPelsWidth/x.dmPelsHeight)-ta)*12000.0+Math.Abs(x.dmPelsWidth-tw)+Math.Abs(x.dmPelsHeight-th)*1.5;
                  return score(a).CompareTo(score(b));
                });
                int n=Math.Min(16,modes.Count);
                for(int i=0;i<n;i++){ var m=modes[i]; int r=ApplySingle(d.DeviceName,ref m,CDS_UPDATEREGISTRY); if(r==0){Thread.Sleep(1000); return $"fallback={m.dmPelsWidth}x{m.dmPelsHeight}@{m.dmDisplayFrequency} snapshot={Snapshot()}";} }
              }
              return "fallback-switch-failed snapshot="+Snapshot();
            }
          }
          '@

          Write-Host "Display before: $([PRDPDisplay]::Snapshot())"
          $native=[PRDPDisplay]::TryPrimaryExact($tw,$th)
          Write-Host "Native exact: $native"
          if($native -like 'primary-exact result=0*'){
            Write-Host 'GEOMETRY READY: native pixel-exact mode.'
            exit 0
          }

          # A native mode with the same aspect ratio is also geometrically exact:
          # the encoder performs uniform scaling only, never stretch/crop.
          $same=[PRDPDisplay]::TryPrimarySameAspect($tw,$th,0.0005)
          Write-Host "Native same-aspect: $same"
          if($same -like 'primary-same-aspect * result=0*'){
            Write-Host 'GEOMETRY READY: native same-aspect mode; uniform scale, no bars/crop/stretch.'
            exit 0
          }

          # Best-effort exact fallback: install the signed Virtual Display Driver only
          # when the hosted runner cannot expose the phone's aspect ratio natively.
          # If this fails, workflow continues and FIT letterboxing is used rather than distortion.
          try {
            $vddRoot='C:\VirtualDisplayDriver'
            New-Item -ItemType Directory -Force -Path $vddRoot | Out-Null
            $xml=@"
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
            <monitors><count>1</count></monitors>
            <gpu><friendlyname>default</friendlyname></gpu>
            <global><g_refresh_rate>60</g_refresh_rate></global>
            <resolutions>
              <resolution><width>$tw</width><height>$th</height><refresh_rate>60</refresh_rate></resolution>
            </resolutions>
          </vdd_settings>
          "@
            [IO.File]::WriteAllText((Join-Path $vddRoot 'vdd_settings.xml'),$xml,(New-Object Text.UTF8Encoding($false)))
            New-Item -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Force | Out-Null
            New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name VDDPATH -Value $vddRoot -PropertyType String -Force | Out-Null

            $tmp=Join-Path $env:RUNNER_TEMP 'prdp-vdd'; Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory $tmp | Out-Null
            $nef=Join-Path $tmp 'nefcon.zip'; $drv=Join-Path $tmp 'vdd.zip'
            Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nef -UseBasicParsing
            Invoke-WebRequest 'https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/25.7.23/VirtualDisplayDriver-x86.Driver.Only.zip' -OutFile $drv -UseBasicParsing
            Expand-Archive $nef (Join-Path $tmp 'nef') -Force
            Expand-Archive $drv (Join-Path $tmp 'drv') -Force
            $inf=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter 'MttVDD.inf' | Select-Object -First 1
            $cat=Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter 'mttvdd.cat' | Select-Object -First 1
            $nefexe=Get-ChildItem (Join-Path $tmp 'nef') -Recurse -Filter 'nefconw.exe' | Where-Object {$_.FullName -match '[\/]x64[\/]' } | Select-Object -First 1
            if(-not $inf -or -not $cat -or -not $nefexe){ throw 'VDD/NefCon payload layout not recognized' }

            $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
            $certs.Import([IO.File]::ReadAllBytes($cat.FullName))
            foreach($c in $certs){
              $cp=Join-Path $tmp ($c.Thumbprint+'.cer')
              [IO.File]::WriteAllBytes($cp,$c.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Import-Certificate -FilePath $cp -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
            }
            & $nefexe.FullName install $inf.FullName 'Root\MttVDD'
            if($LASTEXITCODE -ne 0){ throw "NefCon install exit=$LASTEXITCODE" }
            Start-Sleep -Seconds 8
            try { & "$env:WINDIR\System32\DisplaySwitch.exe" /extend; Start-Sleep -Seconds 3 } catch { Write-Host "DisplaySwitch /extend non-fatal: $_" }

            $made=''
            for($i=0;$i -lt 6;$i++){
              $made=[PRDPDisplay]::MakeExactPrimary($tw,$th)
              Write-Host "VDD exact attempt $($i+1): $made"
              if($made -like 'exact-primary *'){ break }
              Start-Sleep -Seconds 3
            }
            if($made -like 'exact-primary *'){
              try { Stop-Process -Name explorer -Force -ErrorAction SilentlyContinue; Start-Sleep -Milliseconds 600; Start-Process explorer.exe } catch { Write-Host "Explorer refresh non-fatal: $_" }
              Write-Host 'GEOMETRY READY: virtual display exact target; no crop/stretch/letterbox intended.'
              exit 0
            }
            throw "Virtual display installed but exact mode was not made primary: $made"
          } catch {
            Write-Warning "Exact virtual-display fallback failed: $_"
          }

          # Last-resort safety path. It is explicitly allowed to show bars, because
          # bars are the only geometry-safe option when source and phone aspects differ.
          $fallback=[PRDPDisplay]::BestPrimary($tw,$th)
          Write-Warning "GEOMETRY FALLBACK: $fallback"
          Write-Warning 'No stretching/cropping will be used. If aspect differs, Runner will report fit-letterbox and Android will clamp mouse to content.'

      - name: Materialize v2.3.4 host
        shell: pwsh
        run: |
          $b64=''
          $path=Join-Path $env:RUNNER_TEMP 'prdp_v234_host.py'
          [IO.File]::WriteAllBytes($path,[Convert]::FromBase64String($b64))
          python -m py_compile $path
          "RDP_HOST_SCRIPT=$path" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          Write-Host "Host script ready: $path"

      - name: Run PrivateRDP v2.3.4
        shell: pwsh
        env:
          RDP_ROOM: ${{ inputs.room_code }}
          RDP_WIDTH: ${{ inputs.width }}
          RDP_HEIGHT: ${{ inputs.height }}
          RDP_FPS: ${{ inputs.fps }}
          RDP_BITRATE_MBPS: ${{ inputs.bitrate_mbps }}
        run: |
          $ErrorActionPreference='Stop'
          $room=($env:RDP_ROOM -replace '[^A-Za-z0-9]','').ToUpperInvariant()
          if($room.Length -lt 12){throw 'room_code must contain at least 12 alphanumeric characters'}
          $bytes=New-Object byte[] 24
          [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $token=([Convert]::ToHexString($bytes)).ToLowerInvariant()
          $generation="${{ github.run_id }}-${{ github.run_attempt }}"
          $started=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
          $env:RDP_ROOM=$room
          $env:RDP_SESSION_TOKEN=$token
          $env:RDP_GENERATION=$generation
          $env:RDP_STARTED_AT_MS=$started.ToString()
          $env:RDP_UDP_PORT='49100'
          $env:RDP_TCP_PORT='49101'
          $env:RDP_VIDEO_PORT='49102'
          $env:RDP_AUDIO_PORT='49103'
          $env:RDP_AUDIO_RATE='48000'
          $env:DXCAM_WINRT_CURSOR_CAPTURE='0'
          $env:DXCAM_WINRT_BORDER_REQUIRED='0'
          $env:DXCAM_WINRT_FRAME_WAIT_MS='0'
          $env:DXCAM_WINRT_MIN_UPDATE_INTERVAL_MS='0'
          $env:DXCAM_WINRT_FRAME_POOL_SIZE='2'
          Write-Host '=== PrivateRDP v2.3.4 EXACT-ASPECT + INPUT-VERIFY ==='
          Write-Host "Room       : $room"
          Write-Host "Generation : $generation"
          Write-Host "Tailnet IP : $env:RDP_TAILSCALE_IP"
          Write-Host "Stream     : $env:RDP_WIDTH x $env:RDP_HEIGHT @ $env:RDP_FPS fps"
          Write-Host "Bitrate    : $env:RDP_BITRATE_MBPS Mbps (hard cap 10 Mbps)"
          Write-Host 'Display    : aspect-preserving only; exact/same-aspect source preferred; signed VDD best-effort fallback; crop=0 stretch=0'
          Write-Host 'Mouse      : local relative cursor + content mapping + SetCursorPos verification + reliable INPUTACK'
          Write-Host 'Transport  : UDP mouse/liveness + TCP control + H264/TCP video + PCM/TCP audio over Tailscale'
          python -u $env:RDP_HOST_SCRIPT
