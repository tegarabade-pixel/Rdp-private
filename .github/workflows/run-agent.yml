name: Doro AI Runner Single File

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Runner mode"
        required: true
        default: "ai"
        type: choice
        options: [ai, smoke]
      goal:
        description: "Agent goal"
        required: true
        default: "Buka Simulation Room"
        type: string
      pair_token:
        description: "Optional pair token"
        required: false
        default: ""
        type: string
      local_model:
        description: "Local GGUF model"
        required: false
        default: "bartowski/Qwen_Qwen3-1.7B-GGUF:Q4_K_M"
        type: string

jobs:
  runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install websockets==13.1 httpx==0.27.2

      - name: Install cloudflared
        run: |
          curl -L --fail --retry 3 -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb

      - name: Install llama.cpp
        if: ${{ inputs.mode == 'ai' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/llama
          python -c "import json,urllib.request; r=json.load(urllib.request.urlopen(urllib.request.Request('https://api.github.com/repos/ggml-org/llama.cpp/releases?per_page=10',headers={'User-Agent':'DoroStateSync/0.4.9'}),timeout=30)); a=next(x for rel in r for x in rel.get('assets',[]) if x.get('name','').endswith('-bin-ubuntu-x64.tar.gz') and all(k not in x.get('name','') for k in ('vulkan','cuda','rocm'))); print(a['browser_download_url'])" > /tmp/llama_url
          curl -L --fail --retry 3 "$(cat /tmp/llama_url)" -o /tmp/llama.tar.gz
          tar -xzf /tmp/llama.tar.gz -C /tmp/llama
          LLAMA_SERVER="$(find /tmp/llama -type f -name llama-server -perm -111 | head -n 1)"
          test -n "$LLAMA_SERVER"
          echo "LLAMA_SERVER=$LLAMA_SERVER" >> "$GITHUB_ENV"
          echo "LLAMA_LIB_DIR=$(dirname "$LLAMA_SERVER")" >> "$GITHUB_ENV"

