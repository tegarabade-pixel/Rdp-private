          python -c 'import os,base64,pathlib; pathlib.Path("/tmp/doro_runner.py").write_bytes(base64.b64decode("".join(os.environ["RUNNER_B64"].split())))'
          python -m py_compile /tmp/doro_runner.py
          python /tmp/doro_runner.py --self-test
          echo "DEBUG_GATE_PASSED=1"

      - name: Start persistent AI + DATP + public WSS
        shell: bash
        env:
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_GOAL: ${{ inputs.goal }}
          INPUT_PAIR: ${{ inputs.pair_token }}
          INPUT_MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          PAIR="$INPUT_PAIR"
          if [ -z "$PAIR" ]; then PAIR="$(openssl rand -hex 16)"; fi

          MODEL_PID=""
          RESOLVED_MODEL="$INPUT_MODEL"

          if [ "$INPUT_MODE" = "ai" ]; then
            if [ "$RESOLVED_MODEL" = "Qwen/Qwen3-1.7B-GGUF:Q4_K_M" ]; then RESOLVED_MODEL="bartowski/Qwen_Qwen3-1.7B-GGUF:Q4_K_M"; fi
            export LD_LIBRARY_PATH="${LLAMA_LIB_DIR}:${LD_LIBRARY_PATH:-}"

            "$LLAMA_SERVER" -hf "$RESOLVED_MODEL" --host 127.0.0.1 --port 8080 --ctx-size 2048 --parallel 1 --threads 4 --threads-batch 4 --jinja --reasoning off > /tmp/llama.log 2>&1 &
            MODEL_PID=$!

            READY=""
            for i in $(seq 1 180); do
              kill -0 "$MODEL_PID" 2>/dev/null || { cat /tmp/llama.log; exit 1; }
              if curl -fsS --max-time 2 http://127.0.0.1:8080/v1/models >/tmp/models.json 2>/dev/null; then READY=1; break; fi
              sleep 1
            done
            [ -n "$READY" ] || { tail -n 120 /tmp/llama.log; exit 1; }
            echo "MODEL_SERVER_READY=1"
          fi

          python -u /tmp/doro_runner.py --mode "$INPUT_MODE" --goal "$INPUT_GOAL" --token "$PAIR" --llm-base-url http://127.0.0.1:8080/v1 --llm-model auto --max-steps 20 --session-minutes 330 > /tmp/doro.log 2>&1 &
          RUNNER_PID=$!

          for i in $(seq 1 30); do
            grep -q 'SERVER_READY=1' /tmp/doro.log && break
            kill -0 "$RUNNER_PID" 2>/dev/null || { cat /tmp/doro.log; exit 1; }
            sleep 1
          done
          grep -q 'SERVER_READY=1' /tmp/doro.log || { cat /tmp/doro.log; exit 1; }

          cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8765 > /tmp/cloudflared.log 2>&1 &
          TUNNEL_PID=$!

          URL=""
          for i in $(seq 1 60); do
            URL="$(grep -Eo 'https://[a-zA-Z0-9-]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            [ -n "$URL" ] && break
            kill -0 "$TUNNEL_PID" 2>/dev/null || { cat /tmp/cloudflared.log; exit 1; }
            sleep 1
          done
          [ -n "$URL" ] || { cat /tmp/cloudflared.log; exit 1; }
          WSS="${URL/https:\/\//wss://}"

          echo "============================================================"
          echo "DORO AI RUNNER 0.4.9 STATE-SYNC"
          echo "DEBUG_GATE_PASSED=1"
          echo "WSS_URL=$WSS"
          echo "PAIR_TOKEN=$PAIR"
          echo "GOAL=$INPUT_GOAL"
          echo "============================================================"

          tail -n +1 -F /tmp/doro.log &
          DORO_TAIL=$!
          if [ "$INPUT_MODE" = "ai" ]; then
            tail -n 24 -F /tmp/llama.log | sed -u 's/^/[MODEL] /' &
            MODEL_TAIL=$!
          else
            MODEL_TAIL=""
          fi

          cleanup() {
            kill "$DORO_TAIL" 2>/dev/null || true
            [ -z "${MODEL_TAIL:-}" ] || kill "$MODEL_TAIL" 2>/dev/null || true
            kill "$TUNNEL_PID" 2>/dev/null || true
            kill "$RUNNER_PID" 2>/dev/null || true
            [ -z "${MODEL_PID:-}" ] || kill "$MODEL_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          while true; do
            kill -0 "$RUNNER_PID" 2>/dev/null || { echo "ERROR: runner exited"; cat /tmp/doro.log; exit 1; }
            kill -0 "$TUNNEL_PID" 2>/dev/null || { echo "ERROR: cloudflared exited"; tail -n 100 /tmp/cloudflared.log; exit 1; }
            if [ "$INPUT_MODE" = "ai" ]; then
              kill -0 "$MODEL_PID" 2>/dev/null || { echo "ERROR: llama-server exited"; tail -n 120 /tmp/llama.log; exit 1; }
            fi
            sleep 5
          done
