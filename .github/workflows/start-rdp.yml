name: Start PrivateRDP RELAY-LOCK

on:
  workflow_dispatch:
    inputs:
      room_code:
        description: "Room code used by your PrivateRDP APK"
        required: true
        default: "PRIVATE-RDP-2026"
      keep_minutes:
        description: "How long to keep the runner alive"
        required: true
        type: choice
        options: ['60', '180', '330']
        default: '330'
      audio:
        description: "Enable desktop audio (experimental)"
        type: boolean
        required: false
        default: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RDP_SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
      RDP_ROOM: ${{ inputs.room_code }}
      RDP_KEEP_MINUTES: ${{ inputs.keep_minutes }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PrivateRDP low-latency host
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $ProgressPreference='SilentlyContinue'
          $PSNativeCommandUseErrorActionPreference=$true
          python -m pip install --upgrade --disable-pip-version-check pip
          if($LASTEXITCODE -ne 0){throw 'pip bootstrap failed'}
          python -m pip install --disable-pip-version-check --quiet -r requirements.txt
          if($LASTEXITCODE -ne 0){throw 'PrivateRDP dependency install failed'}
          python -c "import av,aiortc,mss,numpy,websockets; print('CORE_IMPORT_OK', aiortc.__version__)"
          if($LASTEXITCODE -ne 0){throw 'WebRTC import preflight failed'}

          foreach($svc in @('AudioEndpointBuilder','Audiosrv')){
            try{Set-Service $svc -StartupType Automatic -ErrorAction SilentlyContinue}catch{}
            try{Start-Service $svc -ErrorAction SilentlyContinue}catch{}
          }

          @'
          from pathlib import Path
          import re
          import aiortc.codecs.h264 as h264
          p=Path(h264.__file__)
          text=p.read_text(encoding='utf-8')
          if '"preset": "ultrafast"' not in text:
              needle='"tune": "zerolatency",'
              if needle not in text:
                  raise SystemExit('aiortc H264 zerolatency patch point not found')
              text=text.replace(needle, needle+'\n                "preset": "ultrafast",',1)
          text=re.sub(r'DEFAULT_BITRATE\s*=\s*1000000(?:\s*#.*)?','DEFAULT_BITRATE = 4500000  # PrivateRDP start',text,count=1)
          text=re.sub(r'MIN_BITRATE\s*=\s*500000(?:\s*#.*)?','MIN_BITRATE = 1200000  # PrivateRDP floor',text,count=1)
          text=re.sub(r'MAX_BITRATE\s*=\s*3000000(?:\s*#.*)?','MAX_BITRATE = 10000000  # PrivateRDP hard ceiling',text,count=1)
          p.write_text(text,encoding='utf-8')
          compile(text,str(p),'exec')
          print('H264 patched:',p)
          '@ | python -
          if($LASTEXITCODE -ne 0){throw 'H264 low-latency patch failed'}
          python -m py_compile desktop-host/rdp_webrtc_host.py rdp_signal_bridge.py scripts/verify_turn.py
          if($LASTEXITCODE -ne 0){throw 'source compile preflight failed'}

      - name: Prepare and verify TURN relay
        shell: pwsh
        env:
          RDP_ICE_SERVERS_JSON_SECRET: ${{ secrets.RDP_ICE_SERVERS_JSON }}
          RDP_CF_TURN_KEY_ID_SECRET: ${{ secrets.RDP_CF_TURN_KEY_ID }}
          RDP_CF_TURN_API_TOKEN_SECRET: ${{ secrets.RDP_CF_TURN_API_TOKEN }}
          RDP_METERED_APP_SECRET: ${{ secrets.RDP_METERED_APP }}
          RDP_METERED_API_KEY_SECRET: ${{ secrets.RDP_METERED_API_KEY }}
          RDP_METERED_REGION_SECRET: ${{ secrets.RDP_METERED_REGION }}
          RDP_TURN_URLS_SECRET: ${{ secrets.RDP_TURN_URLS }}
          RDP_TURN_USERNAME_SECRET: ${{ secrets.RDP_TURN_USERNAME }}
          RDP_TURN_CREDENTIAL_SECRET: ${{ secrets.RDP_TURN_CREDENTIAL }}
        run: ./scripts/prepare_turn.ps1

      - name: Set 1600x720 desktop mode
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          Add-Type -TypeDefinition @'
          using System;
          using System.Runtime.InteropServices;
          public static class PrivateRdpDisplayMode {
            [StructLayout(LayoutKind.Sequential,CharSet=CharSet.Ansi)] public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra;
              public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput;
              public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency;
              public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight;
            }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettings(string n,int i,ref DEVMODE d);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettings(ref DEVMODE d,int f);
            const int CURRENT=-1,W=0x80000,H=0x100000;
            static DEVMODE Fresh(){var d=new DEVMODE();d.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE));return d;}
            public static string Current(){var d=Fresh();return EnumDisplaySettings(null,CURRENT,ref d)?$"{d.dmPelsWidth}x{d.dmPelsHeight}@{d.dmDisplayFrequency}":"unknown";}
            public static string Set(int w,int h){var d=Fresh();if(!EnumDisplaySettings(null,CURRENT,ref d))return "enum-failed";d.dmPelsWidth=w;d.dmPelsHeight=h;d.dmFields|=W|H;int r=ChangeDisplaySettings(ref d,0);return $"result={r} actual={Current()}";}
          }
          '@
          Write-Host "Display before: $([PrivateRdpDisplayMode]::Current())"
          Write-Host "Display set: $([PrivateRdpDisplayMode]::Set(1600,720))"

      - name: Run PrivateRDP RELAY-LOCK
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $room=(($env:RDP_ROOM -replace '[^A-Za-z0-9]','').ToUpperInvariant())
          if($room.Length -lt 12){throw 'room_code must contain at least 12 alphanumeric characters'}
          if($env:RDP_TURN_RELAY_READY -ne '1'){throw 'TURN was not verified; refusing to start relay-only session'}
          $env:RDP_ROOM=$room
          $env:RDP_DESKTOP_WIDTH='1600'
          $env:RDP_DESKTOP_HEIGHT='720'
          $env:RDP_DESKTOP_OS_WIDTH='1600'
          $env:RDP_DESKTOP_OS_HEIGHT='720'
          $env:RDP_DESKTOP_FPS='60'
          $env:RDP_DESKTOP_AUDIO=if('${{ inputs.audio }}' -eq 'true'){'1'}else{'0'}
          $env:RDP_DESKTOP_IPC_PORT='8765'
          $env:DXCAM_WINRT_CURSOR_CAPTURE='0'
          $env:DXCAM_WINRT_BORDER_REQUIRED='0'
          $env:DXCAM_WINRT_FRAME_WAIT_MS='0'
          $env:DXCAM_WINRT_MIN_UPDATE_INTERVAL_MS='0'
          $env:DXCAM_WINRT_FRAME_POOL_SIZE='2'

          $hostOut=Join-Path $env:RUNNER_TEMP 'private-rdp-host.out.log'
          $hostErr=Join-Path $env:RUNNER_TEMP 'private-rdp-host.err.log'
          $sigOut=Join-Path $env:RUNNER_TEMP 'private-rdp-signal.out.log'
          $sigErr=Join-Path $env:RUNNER_TEMP 'private-rdp-signal.err.log'

          function Dump-RdpHostLogs {
            Write-Host '===== PrivateRDP host STDOUT ====='; Get-Content $hostOut -Tail 180 -ErrorAction SilentlyContinue
            Write-Host '===== PrivateRDP host STDERR ====='; Get-Content $hostErr -Tail 180 -ErrorAction SilentlyContinue
          }
          function Start-RdpHost {
            Remove-Item $hostOut,$hostErr -Force -ErrorAction SilentlyContinue
            $python=(Get-Command python).Source
            $p=Start-Process $python -ArgumentList @('-u','desktop-host/rdp_webrtc_host.py') -WindowStyle Hidden -RedirectStandardOutput $hostOut -RedirectStandardError $hostErr -PassThru
            $deadline=(Get-Date).AddSeconds(25);$ok=$false
            while((Get-Date)-lt $deadline){
              Start-Sleep -Milliseconds 300;$p.Refresh();if($p.HasExited){break}
              try{$tcp=New-Object Net.Sockets.TcpClient;$ar=$tcp.BeginConnect('127.0.0.1',8765,$null,$null);if($ar.AsyncWaitHandle.WaitOne(500)-and$tcp.Connected){$ok=$true};$tcp.Close()}catch{}
              if($ok){break}
            }
            if(-not $ok){Dump-RdpHostLogs;throw 'desktop host failed to start'}
            try{(Get-Process -Id $p.Id).PriorityClass='High'}catch{}
            Write-Host "Desktop host IPC ready pid=$($p.Id)";return $p
          }
          function Start-RdpSignal {
            Remove-Item $sigOut,$sigErr -Force -ErrorAction SilentlyContinue
            $python=(Get-Command python).Source
            $p=Start-Process $python -ArgumentList @('-u','rdp_signal_bridge.py') -WindowStyle Hidden -RedirectStandardOutput $sigOut -RedirectStandardError $sigErr -PassThru
            Start-Sleep 2;$p.Refresh()
            if($p.HasExited){Get-Content $sigOut -Tail 120 -ErrorAction SilentlyContinue;Get-Content $sigErr -Tail 180 -ErrorAction SilentlyContinue;throw 'signaling bridge failed to start'}
            try{(Get-Process -Id $p.Id).PriorityClass='AboveNormal'}catch{}
            return $p
          }

          $rdpHostProc=Start-RdpHost
          $rdpSignalProc=Start-RdpSignal
          Write-Host '================================================='
          Write-Host ' PRIVATE RDP v0.2.0 RELAY-LOCK READY'
          Write-Host " Room      : $room"
          Write-Host " TURN      : VERIFIED / $env:RDP_ICE_PROVIDER"
          Write-Host ' Path      : RELAY_ONLY • UDP first • TLS443 fallback'
          Write-Host ' Stream    : 1600x720 @ target 60 FPS'
          Write-Host ' Bitrate   : adaptive, hard ceiling 10 Mbps'
          Write-Host '================================================='

          $end=(Get-Date).AddMinutes([int]'${{ inputs.keep_minutes }}')
          $next=(Get-Date).AddSeconds(20)
          while((Get-Date)-lt $end){
            Start-Sleep 2;$rdpHostProc.Refresh();$rdpSignalProc.Refresh()
            if($rdpHostProc.HasExited){Write-Warning 'desktop host exited; restarting';Dump-RdpHostLogs;$rdpHostProc=Start-RdpHost}
            if($rdpSignalProc.HasExited){Write-Warning 'signaling bridge exited; restarting';Get-Content $sigErr -Tail 120 -ErrorAction SilentlyContinue;$rdpSignalProc=Start-RdpSignal}
            if((Get-Date)-ge $next){
              Write-Host '--- host tail ---';Get-Content $hostErr -Tail 14 -ErrorAction SilentlyContinue
              Write-Host '--- signal tail ---';Get-Content $sigErr -Tail 10 -ErrorAction SilentlyContinue
              $next=(Get-Date).AddSeconds(30)
            }
          }
          Stop-Process -Id $rdpSignalProc.Id -Force -ErrorAction SilentlyContinue
          Stop-Process -Id $rdpHostProc.Id -Force -ErrorAction SilentlyContinue
