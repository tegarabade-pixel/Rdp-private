name: PrivateRDP VDD Probe v0.1 - 1612x720 - Win2022 vs Win2025

on:
  workflow_dispatch:
    inputs:
      width:
        description: Exact virtual display width
        required: true
        default: '1612'
      height:
        description: Exact virtual display height
        required: true
        default: '720'
      refresh_hz:
        description: Refresh rate
        required: true
        default: '60'

permissions:
  contents: read

jobs:
  vdd-probe:
    name: Probe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    env:
      TARGET_W: ${{ inputs.width }}
      TARGET_H: ${{ inputs.height }}
      TARGET_HZ: ${{ inputs.refresh_hz }}
      VDD_ROOT: C:\VirtualDisplayDriver
      VDD_RELEASE: '25.7.23'
      PROBE_DIR: ${{ github.workspace }}\vdd-probe-output

    steps:
      - name: 0 - Prepare probe directory
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path $env:PROBE_DIR -Force | Out-Null
          "PrivateRDP VDD Probe v0.1" | Set-Content "$env:PROBE_DIR\00-header.txt"
          "OS label=${{ matrix.os }}" | Add-Content "$env:PROBE_DIR\00-header.txt"
          "requested=$env:TARGET_W x $env:TARGET_H @ $env:TARGET_HZ Hz" | Add-Content "$env:PROBE_DIR\00-header.txt"
          "run_id=${{ github.run_id }} attempt=${{ github.run_attempt }}" | Add-Content "$env:PROBE_DIR\00-header.txt"

      - name: 1 - Baseline OS session GPU and displays
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out = "$env:PROBE_DIR\01-baseline.txt"
          "=== DATE ===" | Set-Content $out
          Get-Date -Format o | Add-Content $out
          "`n=== OS ===" | Add-Content $out
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsName,OsVersion,OsBuildNumber,OsArchitecture | Format-List | Out-String | Add-Content $out
          cmd /c ver 2>&1 | Add-Content $out
          "`n=== USER / SESSION ===" | Add-Content $out
          whoami /all 2>&1 | Add-Content $out
          query session 2>&1 | Add-Content $out
          query user 2>&1 | Add-Content $out
          "SESSIONNAME=$env:SESSIONNAME USERNAME=$env:USERNAME" | Add-Content $out
          "`n=== GPU / VIDEO CONTROLLERS ===" | Add-Content $out
          Get-CimInstance Win32_VideoController | Select-Object Name,PNPDeviceID,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution,CurrentRefreshRate,Status | Format-List | Out-String | Add-Content $out
          "`n=== PNP DISPLAY CLASS ===" | Add-Content $out
          Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object Status,Class,FriendlyName,InstanceId,Problem,ProblemDescription | Format-Table -AutoSize | Out-String -Width 240 | Add-Content $out
          "`n=== PNP MONITOR CLASS ===" | Add-Content $out
          Get-PnpDevice -Class Monitor -ErrorAction SilentlyContinue | Select-Object Status,Class,FriendlyName,InstanceId,Problem,ProblemDescription | Format-Table -AutoSize | Out-String -Width 240 | Add-Content $out
          "`n=== SYSTEM.WINDOWS.FORMS SCREENS ===" | Add-Content $out
          try {
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.Screen]::AllScreens | ForEach-Object {
              "Device=$($_.DeviceName) Primary=$($_.Primary) Bounds=$($_.Bounds) Working=$($_.WorkingArea)" | Add-Content $out
            }
          } catch { "Screen enumeration failed: $_" | Add-Content $out }
          Get-Content $out

      - name: 2 - Create exact VDD configuration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $w=[int]$env:TARGET_W; $h=[int]$env:TARGET_H; $hz=[int]$env:TARGET_HZ
          if($w -lt 640 -or $h -lt 480 -or $hz -lt 24){ throw 'Probe values are outside conservative VDD ranges.' }
          New-Item -ItemType Directory -Path $env:VDD_ROOT -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:VDD_ROOT\Logs" -Force | Out-Null

          $xml = @"
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
            <monitors><count>1</count></monitors>
            <gpu><friendlyname>default</friendlyname></gpu>
            <global><g_refresh_rate>$hz</g_refresh_rate></global>
            <resolutions>
              <resolution>
                <width>$w</width>
                <height>$h</height>
                <refresh_rate>$hz</refresh_rate>
              </resolution>
            </resolutions>
            <logging>
              <SendLogsThroughPipe>true</SendLogsThroughPipe>
              <logging>true</logging>
              <debuglogging>true</debuglogging>
            </logging>
            <colour>
              <SDR10bit>false</SDR10bit>
              <HDRPlus>false</HDRPlus>
              <ColourFormat>RGB</ColourFormat>
            </colour>
            <cursor>
              <HardwareCursor>true</HardwareCursor>
              <CursorMaxX>128</CursorMaxX>
              <CursorMaxY>128</CursorMaxY>
              <AlphaCursorSupport>true</AlphaCursorSupport>
              <XorCursorSupportLevel>2</XorCursorSupportLevel>
            </cursor>
            <edid>
              <CustomEdid>false</CustomEdid>
              <PreventSpoof>false</PreventSpoof>
              <EdidCeaOverride>false</EdidCeaOverride>
            </edid>
            <edid_integration>
              <enabled>false</enabled>
              <auto_configure_from_edid>false</auto_configure_from_edid>
              <edid_profile_path>EDID/monitor_profile.xml</edid_profile_path>
              <override_manual_settings>false</override_manual_settings>
              <fallback_on_error>true</fallback_on_error>
            </edid_integration>
            <hdr_advanced>
              <hdr10_static_metadata><enabled>false</enabled></hdr10_static_metadata>
              <color_primaries><enabled>false</enabled></color_primaries>
              <color_space><enabled>false</enabled></color_space>
            </hdr_advanced>
            <auto_resolutions>
              <enabled>false</enabled>
              <source_priority>manual</source_priority>
              <edid_mode_filtering>
                <min_refresh_rate>24</min_refresh_rate>
                <max_refresh_rate>240</max_refresh_rate>
                <exclude_fractional_rates>false</exclude_fractional_rates>
                <min_resolution_width>640</min_resolution_width>
                <min_resolution_height>480</min_resolution_height>
                <max_resolution_width>7680</max_resolution_width>
                <max_resolution_height>4320</max_resolution_height>
              </edid_mode_filtering>
              <preferred_mode>
                <use_edid_preferred>false</use_edid_preferred>
                <fallback_width>$w</fallback_width>
                <fallback_height>$h</fallback_height>
                <fallback_refresh>$hz</fallback_refresh>
              </preferred_mode>
            </auto_resolutions>
            <color_advanced>
              <bit_depth_management>
                <auto_select_from_color_space>false</auto_select_from_color_space>
                <force_bit_depth>8</force_bit_depth>
                <fp16_surface_support>true</fp16_surface_support>
              </bit_depth_management>
              <color_format_extended><sdr_white_level>80.0</sdr_white_level></color_format_extended>
            </color_advanced>
          </vdd_settings>
          "@
          $xml = ($xml -replace '(?m)^\s{10}','').Trim() + "`r`n"
          [IO.File]::WriteAllText("$env:VDD_ROOT\vdd_settings.xml",$xml,(New-Object Text.UTF8Encoding($false)))

          New-Item -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name VDDPATH -Value $env:VDD_ROOT -PropertyType String -Force | Out-Null
          # Some VDD builds allow registry-forced logging when XML loading is the thing being debugged.
          New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name LOGS -Value 1 -PropertyType DWord -Force | Out-Null

          Copy-Item "$env:VDD_ROOT\vdd_settings.xml" "$env:PROBE_DIR\02-vdd_settings.xml" -Force
          Get-FileHash "$env:VDD_ROOT\vdd_settings.xml" -Algorithm SHA256 | Format-List | Out-String | Set-Content "$env:PROBE_DIR\02-config-hash.txt"
          Get-ItemProperty 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' | Format-List | Out-String | Set-Content "$env:PROBE_DIR\02-registry.txt"
          Write-Host "Exact-only config created: ${w}x${h}@${hz}"
          Get-Content "$env:VDD_ROOT\vdd_settings.xml"

      - name: 3 - Download signed VDD and official NefCon installer path
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = Join-Path $env:RUNNER_TEMP 'prdp-vdd-probe'
          Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $tmp -Force | Out-Null

          $nef = Join-Path $tmp 'nefcon.zip'
          $drv = Join-Path $tmp 'driver.zip'
          Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nef -UseBasicParsing
          Invoke-WebRequest "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/$env:VDD_RELEASE/VirtualDisplayDriver-x86.Driver.Only.zip" -OutFile $drv -UseBasicParsing
          Expand-Archive $nef (Join-Path $tmp 'nef') -Force
          Expand-Archive $drv (Join-Path $tmp 'drv') -Force

          $nefexe = Get-ChildItem (Join-Path $tmp 'nef') -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
          $inf = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.inf | Select-Object -First 1
          $cat = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter mttvdd.cat | Select-Object -First 1
          $dll = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.dll | Select-Object -First 1
          if(-not $nefexe -or -not $inf -or -not $cat -or -not $dll){ throw 'Signed VDD/NefCon payload layout not recognized.' }

          $meta = @(
            "nefcon=$($nefexe.FullName)",
            "inf=$($inf.FullName)",
            "cat=$($cat.FullName)",
            "dll=$($dll.FullName)",
            "driver_release=$env:VDD_RELEASE"
          )
          $meta | Set-Content "$env:PROBE_DIR\03-payload.txt"
          Get-AuthenticodeSignature $dll.FullName | Format-List * | Out-String | Add-Content "$env:PROBE_DIR\03-payload.txt"
          Get-AuthenticodeSignature $cat.FullName | Format-List * | Out-String | Add-Content "$env:PROBE_DIR\03-payload.txt"

          "VDD_NEFCON=$($nefexe.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "VDD_INF=$($inf.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "VDD_CAT=$($cat.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append
          "VDD_DLL=$($dll.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8NoBOM -Append

      - name: 4 - Install certificates and VDD
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out="$env:PROBE_DIR\04-install.txt"
          "=== CERTIFICATE ===" | Set-Content $out
          try {
            $catBytes=[IO.File]::ReadAllBytes($env:VDD_CAT)
            $certs=New-Object Security.Cryptography.X509Certificates.X509Certificate2Collection
            $certs.Import($catBytes)
            $certDir=Join-Path $env:RUNNER_TEMP 'vdd-probe-certs'
            New-Item -ItemType Directory -Path $certDir -Force | Out-Null
            foreach($cert in $certs){
              $cer=Join-Path $certDir ($cert.Thumbprint+'.cer')
              [IO.File]::WriteAllBytes($cer,$cert.Export([Security.Cryptography.X509Certificates.X509ContentType]::Cert))
              Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-String | Add-Content $out
              "Subject=$($cert.Subject) Thumbprint=$($cert.Thumbprint) NotAfter=$($cert.NotAfter.ToString('o'))" | Add-Content $out
            }
          } catch { "CERT ERROR: $_" | Add-Content $out }

          "`n=== NEFCON INSTALL ===" | Add-Content $out
          & $env:VDD_NEFCON install $env:VDD_INF 'Root\MttVDD' 2>&1 | Tee-Object -FilePath $out -Append
          "nefcon_exit=$LASTEXITCODE" | Add-Content $out
          pnputil /scan-devices 2>&1 | Add-Content $out
          Start-Sleep -Seconds 12
          Get-Content $out

      - name: 5 - Probe PnP health and VDD named pipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $out="$env:PROBE_DIR\05-health-and-pipe.txt"
          "=== PNP AFTER INSTALL ===" | Set-Content $out
          Get-PnpDevice -ErrorAction SilentlyContinue |
            Where-Object { $_.InstanceId -match 'MttVDD|MTT1337|ROOT\\DISPLAY' -or $_.FriendlyName -match 'Virtual Display|Mtt|MikeTheTech' } |
            Select-Object Status,Class,FriendlyName,InstanceId,Problem,ProblemDescription |
            Format-Table -AutoSize | Out-String -Width 260 | Add-Content $out

          "`n=== CIM PNP DETAILS ===" | Add-Content $out
          Get-CimInstance Win32_PnPEntity -ErrorAction SilentlyContinue |
            Where-Object { $_.PNPDeviceID -match 'MttVDD|MTT1337|ROOT\\DISPLAY' -or $_.Name -match 'Virtual Display|Mtt|MikeTheTech' } |
            Select-Object Name,PNPDeviceID,Status,ConfigManagerErrorCode,Service,Manufacturer |
            Format-List | Out-String | Add-Content $out

          "`n=== UMDF / WUDFHost ===" | Add-Content $out
          Get-Process WUDFHost -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Path,StartTime | Format-Table -AutoSize | Out-String | Add-Content $out

          "`n=== PIPE PING ===" | Add-Content $out
          function Invoke-VddPipe([string]$Command){
            $pipe=$null
            try {
              $pipe = New-Object IO.Pipes.NamedPipeClientStream('.', 'MTTVirtualDisplayPipe', [IO.Pipes.PipeDirection]::InOut, [IO.Pipes.PipeOptions]::None)
              $pipe.Connect(2500)
              $payload=[Text.Encoding]::Unicode.GetBytes($Command)
              $pipe.Write($payload,0,$payload.Length); $pipe.Flush()
              $buf=New-Object byte[] 4096
              $task=$pipe.ReadAsync($buf,0,$buf.Length)
              if(-not $task.Wait(3000)){ return '<PIPE_TIMEOUT>' }
              $n=$task.Result
              if($n -gt 0){ return [Text.Encoding]::Unicode.GetString($buf,0,$n).Trim([char[]]@([char]0,[char]13,[char]10,[char]32)) }
              return '<EMPTY_RESPONSE>'
            } catch { return "<PIPE_ERROR> $($_.Exception.GetType().Name): $($_.Exception.Message)" }
            finally { if($pipe){ $pipe.Dispose() } }
          }
          $ping=''
          for($i=1;$i -le 6;$i++){
            $ping=Invoke-VddPipe 'PING'
            "attempt=$i PING => $ping" | Add-Content $out
            if($ping -match 'PONG'){ break }
            Start-Sleep -Seconds 3
          }
          if($ping -match 'PONG'){
            "SETDISPLAYCOUNT 1 => $(Invoke-VddPipe 'SETDISPLAYCOUNT 1')" | Add-Content $out
            Start-Sleep -Seconds 3
          }
          "IDDCXVERSION => $(Invoke-VddPipe 'IDDCXVERSION')" | Add-Content $out
          "GETASSIGNEDGPU => $(Invoke-VddPipe 'GETASSIGNEDGPU')" | Add-Content $out
          "GETALLGPUS => $(Invoke-VddPipe 'GETALLGPUS')" | Add-Content $out
          "GETSETTINGS => $(Invoke-VddPipe 'GETSETTINGS')" | Add-Content $out
          Get-Content $out

      - name: 6 - Enumerate modes, extend topology, and activate exact mode
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class VddDisplayProbe {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE {
              public int cb;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string DeviceName;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceString;
              public int StateFlags;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceID;
              [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceKey;
            }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE {
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName;
              public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra;
              public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput;
              public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate;
              [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName;
              public short dmLogPixels;
              public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency;
              public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight;
            }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string lpDevice,uint iDevNum,ref DISPLAY_DEVICE lpDisplayDevice,uint dwFlags);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string lpszDeviceName,int iModeNum,ref DEVMODE lpDevMode,uint dwFlags);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string lpszDeviceName,ref DEVMODE lpDevMode,IntPtr hwnd,uint dwflags,IntPtr lParam);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string lpszDeviceName,IntPtr lpDevMode,IntPtr hwnd,uint dwflags,IntPtr lParam);
            const int ENUM_CURRENT_SETTINGS=-1;
            const int ATTACHED=0x1, PRIMARY=0x4;
            const int DM_POSITION=0x20, DM_DISPLAYFREQUENCY=0x400000, DM_PELSWIDTH=0x80000, DM_PELSHEIGHT=0x100000;
            const uint CDS_UPDATEREGISTRY=0x1, CDS_TEST=0x2, CDS_SET_PRIMARY=0x10;
            static DISPLAY_DEVICE DD(){ var d=new DISPLAY_DEVICE(); d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE)); return d; }
            static DEVMODE DM(){ var d=new DEVMODE(); d.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE)); return d; }
            public static string Dump(int wantedW,int wantedH,int wantedHz){
              var sb=new StringBuilder();
              for(uint i=0;i<32;i++){
                var dev=DD(); if(!EnumDisplayDevices(null,i,ref dev,0)) break;
                sb.AppendLine($"DISPLAY_DEVICE index={i} name={dev.DeviceName} string={dev.DeviceString} flags=0x{dev.StateFlags:X} attached={((dev.StateFlags&ATTACHED)!=0)} primary={((dev.StateFlags&PRIMARY)!=0)} id={dev.DeviceID}");
                var cur=DM(); if(EnumDisplaySettingsEx(dev.DeviceName,ENUM_CURRENT_SETTINGS,ref cur,0)) sb.AppendLine($"  CURRENT {cur.dmPelsWidth}x{cur.dmPelsHeight}@{cur.dmDisplayFrequency} pos={cur.dmPositionX},{cur.dmPositionY}");
                var seen=new HashSet<string>(); bool exact=false;
                for(int m=0;m<4096;m++){
                  var x=DM(); if(!EnumDisplaySettingsEx(dev.DeviceName,m,ref x,0)) break;
                  string key=$"{x.dmPelsWidth}x{x.dmPelsHeight}@{x.dmDisplayFrequency}";
                  if(seen.Add(key)) sb.AppendLine("  MODE "+key + ((x.dmPelsWidth==wantedW && x.dmPelsHeight==wantedH)?"  <== EXACT SIZE":""));
                  if(x.dmPelsWidth==wantedW && x.dmPelsHeight==wantedH && (wantedHz<=0 || x.dmDisplayFrequency==wantedHz)) exact=true;
                }
                sb.AppendLine("  EXACT_EXPOSED="+exact);
              }
              return sb.ToString();
            }
            public static string TryExact(int w,int h,int hz){
              var sb=new StringBuilder(); bool any=false;
              for(uint i=0;i<32;i++){
                var dev=DD(); if(!EnumDisplayDevices(null,i,ref dev,0)) break;
                DEVMODE best=DM(); bool have=false; int bestHz=-1;
                for(int m=0;m<4096;m++){
                  var x=DM(); if(!EnumDisplaySettingsEx(dev.DeviceName,m,ref x,0)) break;
                  if(x.dmPelsWidth==w && x.dmPelsHeight==h && (hz<=0 || x.dmDisplayFrequency==hz)) { if(!have || x.dmDisplayFrequency>bestHz){best=x;bestHz=x.dmDisplayFrequency;have=true;} }
                }
                if(!have) continue;
                any=true;
                var test=best; int tr=ChangeDisplaySettingsEx(dev.DeviceName,ref test,IntPtr.Zero,CDS_TEST,IntPtr.Zero);
                sb.AppendLine($"TEST device={dev.DeviceName} desc={dev.DeviceString} exact={w}x{h}@{best.dmDisplayFrequency} result={tr}");
                if(tr==0){
                  best.dmFields |= DM_PELSWIDTH|DM_PELSHEIGHT|DM_POSITION;
                  if(best.dmDisplayFrequency>0) best.dmFields |= DM_DISPLAYFREQUENCY;
                  best.dmPositionX=0; best.dmPositionY=0;
                  int ar=ChangeDisplaySettingsEx(dev.DeviceName,ref best,IntPtr.Zero,CDS_UPDATEREGISTRY|CDS_SET_PRIMARY,IntPtr.Zero);
                  int cr=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);
                  sb.AppendLine($"APPLY result={ar} commit={cr}");
                }
              }
              if(!any) sb.AppendLine("NO_DEVICE_EXPOSES_EXACT_MODE");
              return sb.ToString();
            }
          }
          '@
          [VddDisplayProbe]::Dump([int]$env:TARGET_W,[int]$env:TARGET_H,[int]$env:TARGET_HZ) | Tee-Object "$env:PROBE_DIR\06-modes-before.txt"

          $ErrorActionPreference='Continue'
          $out="$env:PROBE_DIR\07-exact-activation.txt"
          "=== DISPLAYSWITCH EXTEND ===" | Set-Content $out
          & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend 2>&1 | Add-Content $out
          Start-Sleep -Seconds 5
          "`n=== EXACT APPLY ===" | Add-Content $out
          [VddDisplayProbe]::TryExact([int]$env:TARGET_W,[int]$env:TARGET_H,[int]$env:TARGET_HZ) | Add-Content $out
          Start-Sleep -Seconds 3
          "`n=== MODES AFTER ===" | Add-Content $out
          [VddDisplayProbe]::Dump([int]$env:TARGET_W,[int]$env:TARGET_H,[int]$env:TARGET_HZ) | Add-Content $out
          "`n=== WINDOWS.FORMS SCREENS AFTER ===" | Add-Content $out
          try {
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.Screen]::AllScreens | ForEach-Object {
              "Device=$($_.DeviceName) Primary=$($_.Primary) Bounds=$($_.Bounds) Working=$($_.WorkingArea)" | Add-Content $out
            }
          } catch { "Screen enumeration failed: $_" | Add-Content $out }
          Get-Content $out

      - name: 7 - Capture screenshots of all active screens
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          try {
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $i=0
            foreach($s in [System.Windows.Forms.Screen]::AllScreens){
              $b=$s.Bounds
              if($b.Width -le 0 -or $b.Height -le 0){ continue }
              $bmp=New-Object Drawing.Bitmap $b.Width,$b.Height
              $g=[Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X,$b.Y,0,0,$b.Size,[Drawing.CopyPixelOperation]::SourceCopy)
              $path="$env:PROBE_DIR\08-screen-$i-$($b.Width)x$($b.Height).png"
              $bmp.Save($path,[Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose(); $bmp.Dispose(); $i++
              Write-Host "Saved $path"
            }
          } catch { "Screenshot failed: $_" | Set-Content "$env:PROBE_DIR\08-screenshot-error.txt" }

      - name: 8 - Collect VDD logs event logs and final verdict
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference='Continue'
          $out="$env:PROBE_DIR\09-final.txt"
          "=== FINAL PNP ===" | Set-Content $out
          Get-PnpDevice -ErrorAction SilentlyContinue |
            Where-Object { $_.InstanceId -match 'MttVDD|MTT1337|ROOT\\DISPLAY' -or $_.FriendlyName -match 'Virtual Display|Mtt|MikeTheTech' } |
            Select-Object Status,Class,FriendlyName,InstanceId,Problem,ProblemDescription |
            Format-Table -AutoSize | Out-String -Width 260 | Add-Content $out

          "`n=== FINAL SCREENS ===" | Add-Content $out
          try {
            Add-Type -AssemblyName System.Windows.Forms
            [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "Device=$($_.DeviceName) Primary=$($_.Primary) Bounds=$($_.Bounds)" | Add-Content $out }
          } catch { "Screen enum failed: $_" | Add-Content $out }

          "`n=== EXACT VERDICT ===" | Add-Content $out
          $exact=$false
          try {
            foreach($s in [System.Windows.Forms.Screen]::AllScreens){ if($s.Bounds.Width -eq [int]$env:TARGET_W -and $s.Bounds.Height -eq [int]$env:TARGET_H){ $exact=$true } }
          } catch {}
          $healthText = if(Test-Path "$env:PROBE_DIR\05-health-and-pipe.txt"){ Get-Content "$env:PROBE_DIR\05-health-and-pipe.txt" -Raw } else { '' }
          $modeText = if(Test-Path "$env:PROBE_DIR\06-modes-before.txt"){ Get-Content "$env:PROBE_DIR\06-modes-before.txt" -Raw } else { '' }
          $actText = if(Test-Path "$env:PROBE_DIR\07-exact-activation.txt"){ Get-Content "$env:PROBE_DIR\07-exact-activation.txt" -Raw } else { '' }
          $pipeOk = $healthText -match 'PING => PONG'
          $exactExposed = ($modeText -match 'EXACT_EXPOSED=True') -or ($actText -match 'EXACT_EXPOSED=True')
          $applyOk = $actText -match 'APPLY result=0'
          $pnpOk = $healthText -match '(?im)^OK\s+Display.*(Virtual|Mtt|MikeTheTech)|Status\s*:\s*OK'

          if($exact){
            $verdict='PASS_EXACT_ACTIVE'
            $reason="Exact ${env:TARGET_W}x${env:TARGET_H} became an active Windows screen."
          } elseif(-not $pnpOk -and -not $pipeOk){
            $verdict='FAIL_DRIVER_OR_UMDF_NOT_HEALTHY'
            $reason='VDD did not reach a healthy PnP/pipe state. Inspect Code 31/Code 10, WUDFHost, driver logs and System events.'
          } elseif(-not $pipeOk){
            $verdict='FAIL_DRIVER_PIPE_NOT_RESPONDING'
            $reason='A VDD-related device may exist, but MTTVirtualDisplayPipe did not answer PING/PONG.'
          } elseif(-not $exactExposed){
            $verdict='FAIL_CUSTOM_MODE_NOT_EXPOSED'
            $reason="VDD is alive but Windows never enumerated ${env:TARGET_W}x${env:TARGET_H}; focus on XML loading/mode publication."
          } elseif(-not $applyOk){
            $verdict='FAIL_EXACT_MODE_EXPOSED_BUT_APPLY_FAILED'
            $reason='The exact mode exists, but ChangeDisplaySettingsEx TEST/APPLY did not complete successfully.'
          } else {
            $verdict='FAIL_EXACT_APPLIED_BUT_NOT_ACTIVE_SCREEN'
            $reason='The mode was exposed/applied but did not become an active Screen; focus on display topology/session attachment.'
          }
          "RESULT=$verdict" | Add-Content $out
          "REASON=$reason" | Add-Content $out
          "PIPE_OK=$pipeOk EXACT_EXPOSED=$exactExposed APPLY_OK=$applyOk ACTIVE_EXACT=$exact" | Add-Content $out

          "`n=== VDD LOG FILES ===" | Add-Content $out
          if(Test-Path "$env:VDD_ROOT\Logs"){
            Get-ChildItem "$env:VDD_ROOT\Logs" -File -ErrorAction SilentlyContinue | Select-Object Name,Length,LastWriteTime | Format-Table -AutoSize | Out-String | Add-Content $out
            Copy-Item "$env:VDD_ROOT\Logs\*" "$env:PROBE_DIR\" -Force -ErrorAction SilentlyContinue
          }

          "`n=== RECENT DRIVER FRAMEWORK / PNP EVENTS ===" | Add-Content $out
          try {
            Get-WinEvent -FilterHashtable @{LogName='System'; StartTime=(Get-Date).AddMinutes(-15)} -ErrorAction Stop |
              Where-Object { $_.ProviderName -match 'Kernel-PnP|DriverFrameworks|Display|UserPnp' -or $_.Message -match 'MttVDD|virtual display|indirect display|UMDF' } |
              Select-Object -First 120 TimeCreated,Id,LevelDisplayName,ProviderName,Message |
              Format-List | Out-String -Width 260 | Add-Content $out
          } catch { "System event query failed: $_" | Add-Content $out }

          Get-Content $out

          # Human-readable GitHub step summary.
          "## PrivateRDP VDD Probe - ${{ matrix.os }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Requested: **$env:TARGET_W x $env:TARGET_H @ $env:TARGET_HZ Hz**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Result: **$verdict**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Reason: $reason" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Checks: pipe=$pipeOk, exact-mode-exposed=$exactExposed, apply=$applyOk, active-exact=$exact" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Download the `vdd-probe-${{ matrix.os }}` artifact and send it back for layer-by-layer diagnosis." | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: 9 - Upload full probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vdd-probe-${{ matrix.os }}
          path: ${{ github.workspace }}\vdd-probe-output
          if-no-files-found: warn
          retention-days: 7
