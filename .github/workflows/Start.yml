name: PrivateRDP VDD Probe v0.2 - NO-SKIP

on:
  workflow_dispatch:
    inputs:
      width:
        description: Exact virtual display width
        required: true
        default: '1612'
      height:
        description: Exact virtual display height
        required: true
        default: '720'
      refresh_hz:
        description: Refresh rate
        required: true
        default: '60'

permissions:
  contents: read

jobs:
  probe:
    name: Probe ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    env:
      TARGET_W: ${{ inputs.width }}
      TARGET_H: ${{ inputs.height }}
      TARGET_HZ: ${{ inputs.refresh_hz }}
      VDD_ROOT: C:\VirtualDisplayDriver
      VDD_RELEASE: '25.7.23'
      PROBE_DIR: ${{ github.workspace }}\vdd-probe-v02

    steps:
      - name: Full VDD probe - never skip later diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $ProgressPreference = 'SilentlyContinue'
          $w = [int]$env:TARGET_W
          $h = [int]$env:TARGET_H
          $hz = [int]$env:TARGET_HZ

          New-Item -ItemType Directory -Path $env:PROBE_DIR -Force | Out-Null
          New-Item -ItemType Directory -Path $env:VDD_ROOT -Force | Out-Null
          New-Item -ItemType Directory -Path "$env:VDD_ROOT\Logs" -Force | Out-Null

          $master = Join-Path $env:PROBE_DIR '00-master.log'
          "PrivateRDP VDD Probe v0.2 NO-SKIP" | Set-Content $master
          "OS=${{ matrix.os }} requested=${w}x${h}@${hz}" | Add-Content $master
          "Started=$(Get-Date -Format o)" | Add-Content $master

          function Log([string]$s) {
            $line = "[$(Get-Date -Format 'HH:mm:ss.fff')] $s"
            Write-Host $line
            $line | Add-Content $master
          }
          function Save-Exception([string]$stage, $err) {
            $path = Join-Path $env:PROBE_DIR ("ERR-" + $stage + '.txt')
            "STAGE=$stage" | Set-Content $path
            "MESSAGE=$($err.Exception.Message)" | Add-Content $path
            "TYPE=$($err.Exception.GetType().FullName)" | Add-Content $path
            "SCRIPT_STACK=$($err.ScriptStackTrace)" | Add-Content $path
            ($err | Format-List * -Force | Out-String) | Add-Content $path
            Log "ERROR stage=$stage message=$($err.Exception.Message)"
          }

          # Keep every diagnostic stage independent. A failure in one stage must not
          # prevent the later stages from generating evidence.
          $configOk = $false
          $downloadOk = $false
          $installExit = $null
          $pnpFound = $false
          $pnpProblem = $null
          $pipeOk = $false
          $exactExposed = $false
          $applyOk = $false
          $activeExact = $false
          $nefexe = $null
          $inf = $null
          $cat = $null
          $dll = $null

          # ---------- BASELINE ----------
          try {
            Log 'STAGE baseline START'
            $o = Join-Path $env:PROBE_DIR '01-baseline.txt'
            "=== OS ===" | Set-Content $o
            Get-ComputerInfo | Select-Object WindowsProductName,OsName,OsVersion,OsBuildNumber,OsArchitecture |
              Format-List | Out-String | Add-Content $o
            cmd /c ver 2>&1 | Add-Content $o
            "`n=== USER ===" | Add-Content $o
            whoami /all 2>&1 | Add-Content $o
            "`n=== SESSION ===" | Add-Content $o
            query session 2>&1 | Add-Content $o
            query user 2>&1 | Add-Content $o
            "`n=== VIDEO ===" | Add-Content $o
            Get-CimInstance Win32_VideoController | Select-Object Name,PNPDeviceID,DriverVersion,CurrentHorizontalResolution,CurrentVerticalResolution,CurrentRefreshRate,Status |
              Format-List | Out-String | Add-Content $o
            "`n=== DISPLAY PNP ===" | Add-Content $o
            Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object Status,FriendlyName,InstanceId,Problem,ProblemDescription |
              Format-Table -AutoSize | Out-String -Width 260 | Add-Content $o
            Log 'STAGE baseline END'
          } catch { Save-Exception 'baseline' $_ }

          # ---------- CONFIG ----------
          try {
            Log 'STAGE config START'
            "config-stage-start $(Get-Date -Format o)" | Set-Content (Join-Path $env:PROBE_DIR '02-config-stage.txt')
            $xml = @"
          <?xml version='1.0' encoding='utf-8'?>
          <vdd_settings>
            <monitors><count>1</count></monitors>
            <gpu><friendlyname>default</friendlyname></gpu>
            <global><g_refresh_rate>$hz</g_refresh_rate></global>
            <resolutions>
              <resolution>
                <width>$w</width>
                <height>$h</height>
                <refresh_rate>$hz</refresh_rate>
              </resolution>
            </resolutions>
            <logging>
              <SendLogsThroughPipe>true</SendLogsThroughPipe>
              <logging>true</logging>
              <debuglogging>true</debuglogging>
            </logging>
            <colour>
              <SDR10bit>false</SDR10bit>
              <HDRPlus>false</HDRPlus>
              <ColourFormat>RGB</ColourFormat>
            </colour>
            <cursor>
              <HardwareCursor>true</HardwareCursor>
              <CursorMaxX>128</CursorMaxX>
              <CursorMaxY>128</CursorMaxY>
              <AlphaCursorSupport>true</AlphaCursorSupport>
              <XorCursorSupportLevel>2</XorCursorSupportLevel>
            </cursor>
            <edid>
              <CustomEdid>false</CustomEdid>
              <PreventSpoof>false</PreventSpoof>
              <EdidCeaOverride>false</EdidCeaOverride>
            </edid>
            <auto_resolutions>
              <enabled>false</enabled>
              <source_priority>manual</source_priority>
              <edid_mode_filtering>
                <min_refresh_rate>24</min_refresh_rate>
                <max_refresh_rate>240</max_refresh_rate>
                <exclude_fractional_rates>false</exclude_fractional_rates>
                <min_resolution_width>640</min_resolution_width>
                <min_resolution_height>480</min_resolution_height>
                <max_resolution_width>7680</max_resolution_width>
                <max_resolution_height>4320</max_resolution_height>
              </edid_mode_filtering>
              <preferred_mode>
                <use_edid_preferred>false</use_edid_preferred>
                <fallback_width>$w</fallback_width>
                <fallback_height>$h</fallback_height>
                <fallback_refresh>$hz</fallback_refresh>
              </preferred_mode>
            </auto_resolutions>
            <color_advanced>
              <bit_depth_management>
                <auto_select_from_color_space>false</auto_select_from_color_space>
                <force_bit_depth>8</force_bit_depth>
                <fp16_surface_support>true</fp16_surface_support>
              </bit_depth_management>
              <color_format_extended><sdr_white_level>80.0</sdr_white_level></color_format_extended>
            </color_advanced>
          </vdd_settings>
          "@
            $enc = [System.Text.UTF8Encoding]::new($false)
            [System.IO.File]::WriteAllText((Join-Path $env:VDD_ROOT 'vdd_settings.xml'), $xml, $enc)

            New-Item -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Force | Out-Null
            New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name VDDPATH -Value $env:VDD_ROOT -PropertyType String -Force | Out-Null
            New-ItemProperty -Path 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' -Name LOGS -Value 1 -PropertyType DWord -Force | Out-Null

            Copy-Item (Join-Path $env:VDD_ROOT 'vdd_settings.xml') (Join-Path $env:PROBE_DIR '02-vdd_settings.xml') -Force
            Get-ItemProperty 'HKLM:\SOFTWARE\MikeTheTech\VirtualDisplayDriver' | Format-List | Out-String | Set-Content (Join-Path $env:PROBE_DIR '02-registry.txt')
            $configOk = $true
            "configOk=True" | Add-Content (Join-Path $env:PROBE_DIR '02-config-stage.txt')
            Log 'STAGE config END ok=True'
          } catch { Save-Exception 'config' $_ }

          # ---------- DOWNLOAD ----------
          try {
            Log 'STAGE download START'
            $tmp = Join-Path $env:RUNNER_TEMP 'prdp-vdd-probe-v02'
            Remove-Item $tmp -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Path $tmp -Force | Out-Null
            $nefZip = Join-Path $tmp 'nefcon.zip'
            $drvZip = Join-Path $tmp 'driver.zip'
            Invoke-WebRequest 'https://github.com/nefarius/nefcon/releases/download/v1.14.0/nefcon_v1.14.0.zip' -OutFile $nefZip -UseBasicParsing -ErrorAction Stop
            Invoke-WebRequest "https://github.com/VirtualDrivers/Virtual-Display-Driver/releases/download/$env:VDD_RELEASE/VirtualDisplayDriver-x86.Driver.Only.zip" -OutFile $drvZip -UseBasicParsing -ErrorAction Stop
            Expand-Archive $nefZip (Join-Path $tmp 'nef') -Force
            Expand-Archive $drvZip (Join-Path $tmp 'drv') -Force

            $nefexe = Get-ChildItem (Join-Path $tmp 'nef') -Recurse -Filter nefconw.exe | Where-Object FullName -Match '\\x64\\' | Select-Object -First 1
            $inf = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.inf | Select-Object -First 1
            $cat = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter mttvdd.cat | Select-Object -First 1
            $dll = Get-ChildItem (Join-Path $tmp 'drv') -Recurse -Filter MttVDD.dll | Select-Object -First 1
            if(-not $nefexe -or -not $inf -or -not $cat -or -not $dll){ throw 'Payload layout not recognized.' }

            $p = Join-Path $env:PROBE_DIR '03-payload.txt'
            "nefcon=$($nefexe.FullName)" | Set-Content $p
            "inf=$($inf.FullName)" | Add-Content $p
            "cat=$($cat.FullName)" | Add-Content $p
            "dll=$($dll.FullName)" | Add-Content $p
            "`n=== DLL SIGNATURE ===" | Add-Content $p
            Get-AuthenticodeSignature $dll.FullName | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate | Out-String | Add-Content $p
            "`n=== CAT SIGNATURE ===" | Add-Content $p
            Get-AuthenticodeSignature $cat.FullName | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate | Out-String | Add-Content $p
            $downloadOk = $true
            Log 'STAGE download END ok=True'
          } catch { Save-Exception 'download' $_ }

          # ---------- INSTALL ----------
          if($downloadOk) {
            try {
              Log 'STAGE install START'
              $io = Join-Path $env:PROBE_DIR '04-install.txt'
              "=== CERTIFICATES (same method as upstream silent-install.ps1) ===" | Set-Content $io
              try {
                $catBytes = [System.IO.File]::ReadAllBytes($cat.FullName)
                $certs = [System.Security.Cryptography.X509Certificates.X509Certificate2Collection]::new()
                $certs.Import($catBytes)
                $certDir = Join-Path $env:RUNNER_TEMP 'vdd-probe-v02-certs'
                New-Item -ItemType Directory -Path $certDir -Force | Out-Null
                foreach($certObj in $certs) {
                  $cer = Join-Path $certDir ($certObj.Thumbprint + '.cer')
                  [System.IO.File]::WriteAllBytes($cer, $certObj.Export([System.Security.Cryptography.X509Certificates.X509ContentType]::Cert))
                  Import-Certificate -FilePath $cer -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-String | Add-Content $io
                  "Subject=$($certObj.Subject) Thumbprint=$($certObj.Thumbprint)" | Add-Content $io
                }
              } catch { "CERT_ERROR=$($_.Exception.Message)" | Add-Content $io }

              try { wevtutil sl Microsoft-Windows-DriverFrameworks-UserMode/Operational /e:true 2>&1 | Add-Content $io } catch {}

              "`n=== NEFCON INSTALL ===" | Add-Content $io
              & $nefexe.FullName install $inf.FullName 'Root\MttVDD' 2>&1 | Tee-Object -FilePath $io -Append
              $installExit = $LASTEXITCODE
              "nefcon_exit=$installExit" | Add-Content $io
              "`n=== PNPUTIL SCAN ===" | Add-Content $io
              pnputil /scan-devices 2>&1 | Add-Content $io
              Start-Sleep -Seconds 15
              Log "STAGE install END nefcon_exit=$installExit"
            } catch { Save-Exception 'install' $_ }
          } else {
            "SKIPPED because downloadOk=False" | Set-Content (Join-Path $env:PROBE_DIR '04-install-SKIPPED.txt')
          }

          # ---------- HEALTH / PNP / PIPE ----------
          try {
            Log 'STAGE health START'
            $ho = Join-Path $env:PROBE_DIR '05-health.txt'
            "=== ALL DISPLAY-CLASS DEVICES ===" | Set-Content $ho
            Get-PnpDevice -Class Display -ErrorAction SilentlyContinue | Select-Object Status,FriendlyName,InstanceId,Problem,ProblemDescription |
              Format-Table -AutoSize | Out-String -Width 300 | Add-Content $ho
            "`n=== VDD-LIKE DEVICES (PRESENT OR PHANTOM) ===" | Add-Content $ho
            $vdds = Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
              $_.InstanceId -match 'MttVDD|MTT1337|ROOT\\MTT|ROOT\\DISPLAY' -or $_.FriendlyName -match 'Virtual Display|Mtt|MikeTheTech'
            }
            $vdds | Select-Object Status,Class,FriendlyName,InstanceId,Problem,ProblemDescription |
              Format-Table -AutoSize | Out-String -Width 300 | Add-Content $ho
            if($vdds) {
              $pnpFound = $true
              foreach($d in $vdds) {
                "`n--- DEVICE $($d.InstanceId) ---" | Add-Content $ho
                try {
                  Get-PnpDeviceProperty -InstanceId $d.InstanceId -ErrorAction SilentlyContinue |
                    Where-Object { $_.KeyName -match 'Problem|Driver|Service|Class|Manufacturer' } |
                    Select-Object KeyName,Data | Format-Table -AutoSize | Out-String -Width 300 | Add-Content $ho
                } catch {}
                try {
                  $pc = (Get-PnpDeviceProperty -InstanceId $d.InstanceId -KeyName 'DEVPKEY_Device_ProblemCode' -ErrorAction Stop).Data
                  "ProblemCode=$pc" | Add-Content $ho
                  if($null -eq $pnpProblem -or [int]$pc -ne 0){ $pnpProblem = [int]$pc }
                } catch {}
              }
            }
            "`n=== PNPUTIL DISPLAY CLASS ===" | Add-Content $ho
            pnputil /enum-devices /class Display /drivers 2>&1 | Add-Content $ho
            "`n=== WUDFHost ===" | Add-Content $ho
            Get-Process WUDFHost -ErrorAction SilentlyContinue | Select-Object Id,ProcessName,Path,StartTime |
              Format-Table -AutoSize | Out-String | Add-Content $ho
            "`n=== KNOWN PIPES MATCHING MTT/VDD ===" | Add-Content $ho
            try { Get-ChildItem '\\.\pipe\' -ErrorAction Stop | Where-Object Name -Match 'MTT|VDD|VirtualDisplay' | Select-Object Name | Format-Table -AutoSize | Out-String | Add-Content $ho } catch { "pipe listing failed: $($_.Exception.Message)" | Add-Content $ho }

            function Invoke-VddPipe([string]$Command){
              $pipe = $null
              try {
                $pipe = [System.IO.Pipes.NamedPipeClientStream]::new('.', 'MTTVirtualDisplayPipe', [System.IO.Pipes.PipeDirection]::InOut)
                $pipe.Connect(2500)
                $payload = [System.Text.Encoding]::Unicode.GetBytes($Command)
                $pipe.Write($payload,0,$payload.Length); $pipe.Flush()
                $buf = New-Object byte[] 8192
                $task = $pipe.ReadAsync($buf,0,$buf.Length)
                if(-not $task.Wait(3000)){ return '<PIPE_TIMEOUT>' }
                $n = $task.Result
                if($n -gt 0){ return [System.Text.Encoding]::Unicode.GetString($buf,0,$n).Trim([char[]]@([char]0,[char]13,[char]10,[char]32)) }
                return '<EMPTY_RESPONSE>'
              } catch { return "<PIPE_ERROR> $($_.Exception.GetType().Name): $($_.Exception.Message)" }
              finally { if($pipe){ $pipe.Dispose() } }
            }
            "`n=== PIPE ===" | Add-Content $ho
            for($i=1; $i -le 5; $i++) {
              $r = Invoke-VddPipe 'PING'
              "attempt=$i PING => $r" | Add-Content $ho
              if($r -match 'PONG') { $pipeOk = $true; break }
              Start-Sleep -Seconds 2
            }
            if($pipeOk) {
              "SETDISPLAYCOUNT 1 => $(Invoke-VddPipe 'SETDISPLAYCOUNT 1')" | Add-Content $ho
              "IDDCXVERSION => $(Invoke-VddPipe 'IDDCXVERSION')" | Add-Content $ho
              "GETASSIGNEDGPU => $(Invoke-VddPipe 'GETASSIGNEDGPU')" | Add-Content $ho
              "GETALLGPUS => $(Invoke-VddPipe 'GETALLGPUS')" | Add-Content $ho
              Start-Sleep -Seconds 4
            }
            Log "STAGE health END pnpFound=$pnpFound problem=$pnpProblem pipeOk=$pipeOk"
          } catch { Save-Exception 'health' $_ }

          # ---------- MODE ENUMERATION / APPLY ----------
          try {
            Log 'STAGE modes START'
            Add-Type -TypeDefinition @'
          using System;
          using System.Text;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          public static class ExactDisplayProbeV02 {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DISPLAY_DEVICE { public int cb; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string DeviceName; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceString; public int StateFlags; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceID; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=128)] public string DeviceKey; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Ansi)]
            public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmDeviceName; public short dmSpecVersion,dmDriverVersion,dmSize,dmDriverExtra; public int dmFields,dmPositionX,dmPositionY,dmDisplayOrientation,dmDisplayFixedOutput; public short dmColor,dmDuplex,dmYResolution,dmTTOption,dmCollate; [MarshalAs(UnmanagedType.ByValTStr,SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel,dmPelsWidth,dmPelsHeight,dmDisplayFlags,dmDisplayFrequency; public int dmICMMethod,dmICMIntent,dmMediaType,dmDitherType,dmReserved1,dmReserved2,dmPanningWidth,dmPanningHeight; }
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplayDevices(string a,uint i,ref DISPLAY_DEVICE d,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern bool EnumDisplaySettingsEx(string n,int i,ref DEVMODE m,uint f);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,ref DEVMODE m,IntPtr h,uint f,IntPtr p);
            [DllImport("user32.dll",CharSet=CharSet.Ansi)] static extern int ChangeDisplaySettingsEx(string n,IntPtr m,IntPtr h,uint f,IntPtr p);
            const int CUR=-1, ATT=1, PRI=4; const int DM_POSITION=0x20,DM_FREQ=0x400000,DM_W=0x80000,DM_H=0x100000; const uint CDS_UP=1,CDS_TEST=2,CDS_PRIMARY=0x10;
            static DISPLAY_DEVICE DD(){var d=new DISPLAY_DEVICE();d.cb=Marshal.SizeOf(typeof(DISPLAY_DEVICE));return d;} static DEVMODE DM(){var m=new DEVMODE();m.dmSize=(short)Marshal.SizeOf(typeof(DEVMODE));return m;}
            public static string Dump(int w,int h,int hz){var sb=new StringBuilder();for(uint i=0;i<32;i++){var d=DD();if(!EnumDisplayDevices(null,i,ref d,0))break;sb.AppendLine($"DEV {i} {d.DeviceName} desc={d.DeviceString} flags=0x{d.StateFlags:X} attached={((d.StateFlags&ATT)!=0)} primary={((d.StateFlags&PRI)!=0)} id={d.DeviceID}");var c=DM();if(EnumDisplaySettingsEx(d.DeviceName,CUR,ref c,0))sb.AppendLine($" CURRENT {c.dmPelsWidth}x{c.dmPelsHeight}@{c.dmDisplayFrequency} pos={c.dmPositionX},{c.dmPositionY}");var seen=new HashSet<string>();bool ex=false;for(int x=0;x<4096;x++){var m=DM();if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;var k=$"{m.dmPelsWidth}x{m.dmPelsHeight}@{m.dmDisplayFrequency}";if(seen.Add(k))sb.AppendLine(" MODE "+k+((m.dmPelsWidth==w&&m.dmPelsHeight==h)?" <== EXACT SIZE":""));if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz))ex=true;}sb.AppendLine(" EXACT_EXPOSED="+ex);}return sb.ToString();}
            public static string Apply(int w,int h,int hz){var sb=new StringBuilder();bool any=false;for(uint i=0;i<32;i++){var d=DD();if(!EnumDisplayDevices(null,i,ref d,0))break;DEVMODE best=DM();bool have=false;for(int x=0;x<4096;x++){var m=DM();if(!EnumDisplaySettingsEx(d.DeviceName,x,ref m,0))break;if(m.dmPelsWidth==w&&m.dmPelsHeight==h&&(hz<=0||m.dmDisplayFrequency==hz)){best=m;have=true;break;}}if(!have)continue;any=true;var t=best;int tr=ChangeDisplaySettingsEx(d.DeviceName,ref t,IntPtr.Zero,CDS_TEST,IntPtr.Zero);sb.AppendLine($"TEST {d.DeviceName} {d.DeviceString} result={tr}");if(tr==0){best.dmFields|=DM_W|DM_H|DM_POSITION;if(best.dmDisplayFrequency>0)best.dmFields|=DM_FREQ;best.dmPositionX=0;best.dmPositionY=0;int ar=ChangeDisplaySettingsEx(d.DeviceName,ref best,IntPtr.Zero,CDS_UP|CDS_PRIMARY,IntPtr.Zero);int cr=ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero);sb.AppendLine($"APPLY result={ar} commit={cr}");}}if(!any)sb.AppendLine("NO_DEVICE_EXPOSES_EXACT_MODE");return sb.ToString();}
          }
          '@
            $mo = Join-Path $env:PROBE_DIR '06-modes.txt'
            "=== BEFORE EXTEND ===" | Set-Content $mo
            $dump1 = [ExactDisplayProbeV02]::Dump($w,$h,$hz)
            $dump1 | Add-Content $mo
            if($dump1 -match 'EXACT_EXPOSED=True'){ $exactExposed = $true }
            "`n=== DISPLAYSWITCH /extend ===" | Add-Content $mo
            & "$env:SystemRoot\System32\DisplaySwitch.exe" /extend 2>&1 | Add-Content $mo
            Start-Sleep -Seconds 5
            $dump2 = [ExactDisplayProbeV02]::Dump($w,$h,$hz)
            "`n=== AFTER EXTEND ===" | Add-Content $mo
            $dump2 | Add-Content $mo
            if($dump2 -match 'EXACT_EXPOSED=True'){ $exactExposed = $true }
            if($exactExposed) {
              $ap = [ExactDisplayProbeV02]::Apply($w,$h,$hz)
              "`n=== APPLY ===" | Add-Content $mo
              $ap | Add-Content $mo
              if($ap -match 'APPLY result=0'){ $applyOk = $true }
              Start-Sleep -Seconds 4
            }
            "`n=== WINDOWS FORMS SCREENS ===" | Add-Content $mo
            Add-Type -AssemblyName System.Windows.Forms
            foreach($s in [System.Windows.Forms.Screen]::AllScreens) {
              "Device=$($s.DeviceName) Primary=$($s.Primary) Bounds=$($s.Bounds)" | Add-Content $mo
              if($s.Bounds.Width -eq $w -and $s.Bounds.Height -eq $h){ $activeExact = $true }
            }
            Log "STAGE modes END exactExposed=$exactExposed applyOk=$applyOk activeExact=$activeExact"
          } catch { Save-Exception 'modes' $_ }

          # ---------- SCREENSHOT ----------
          try {
            Log 'STAGE screenshot START'
            Add-Type -AssemblyName System.Windows.Forms
            Add-Type -AssemblyName System.Drawing
            $i=0
            foreach($s in [System.Windows.Forms.Screen]::AllScreens) {
              $b=$s.Bounds
              if($b.Width -le 0 -or $b.Height -le 0){ continue }
              $bmp=[System.Drawing.Bitmap]::new($b.Width,$b.Height)
              $g=[System.Drawing.Graphics]::FromImage($bmp)
              $g.CopyFromScreen($b.X,$b.Y,0,0,$b.Size,[System.Drawing.CopyPixelOperation]::SourceCopy)
              $bmp.Save((Join-Path $env:PROBE_DIR ("07-screen-$i-$($b.Width)x$($b.Height).png")),[System.Drawing.Imaging.ImageFormat]::Png)
              $g.Dispose();$bmp.Dispose();$i++
            }
            Log 'STAGE screenshot END'
          } catch { Save-Exception 'screenshot' $_ }

          # ---------- EVENTS / VDD LOGS ----------
          try {
            Log 'STAGE events START'
            $eo = Join-Path $env:PROBE_DIR '08-events.txt'
            "=== SYSTEM PNP / UMDF / DISPLAY EVENTS ===" | Set-Content $eo
            Get-WinEvent -FilterHashtable @{LogName='System';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
              Where-Object { $_.ProviderName -match 'Kernel-PnP|DriverFrameworks|Display|UserPnp' -or $_.Message -match 'MttVDD|virtual display|indirect display|UMDF' } |
              Select-Object -First 200 TimeCreated,Id,LevelDisplayName,ProviderName,Message |
              Format-List | Out-String -Width 320 | Add-Content $eo
            "`n=== DriverFrameworks-UserMode/Operational ===" | Add-Content $eo
            Get-WinEvent -FilterHashtable @{LogName='Microsoft-Windows-DriverFrameworks-UserMode/Operational';StartTime=(Get-Date).AddMinutes(-20)} -ErrorAction SilentlyContinue |
              Select-Object -First 200 TimeCreated,Id,LevelDisplayName,ProviderName,Message |
              Format-List | Out-String -Width 320 | Add-Content $eo
            if(Test-Path "$env:VDD_ROOT\Logs") { Copy-Item "$env:VDD_ROOT\Logs\*" $env:PROBE_DIR -Force -ErrorAction SilentlyContinue }
            Log 'STAGE events END'
          } catch { Save-Exception 'events' $_ }

          # ---------- FINAL VERDICT ----------
          $verdict = 'UNKNOWN'
          $reason = 'No classification.'
          if($activeExact) {
            $verdict='PASS_EXACT_ACTIVE'; $reason="Exact ${w}x${h}@${hz} is an active Windows screen."
          } elseif(-not $downloadOk) {
            $verdict='FAIL_DOWNLOAD'; $reason='Driver/NefCon payload could not be downloaded or discovered.'
          } elseif($null -ne $installExit -and $installExit -ne 0 -and -not $pnpFound) {
            $verdict='FAIL_INSTALL'; $reason="NefCon exited $installExit and no VDD PnP node was found."
          } elseif($pnpFound -and $null -ne $pnpProblem -and $pnpProblem -ne 0) {
            $verdict="FAIL_PNP_CODE_$pnpProblem"; $reason="VDD PnP node exists but Windows reports ProblemCode=$pnpProblem."
          } elseif(-not $pnpFound) {
            $verdict='FAIL_NO_VDD_PNP_NODE'; $reason='Installation was attempted but no VDD-like PnP node is visible.'
          } elseif(-not $pipeOk) {
            $verdict='FAIL_PIPE'; $reason='VDD-like PnP node exists, but MTTVirtualDisplayPipe never answered PING/PONG.'
          } elseif(-not $exactExposed) {
            $verdict='FAIL_CUSTOM_MODE_NOT_EXPOSED'; $reason="Driver is reachable but ${w}x${h}@${hz} is not enumerated by Windows."
          } elseif(-not $applyOk) {
            $verdict='FAIL_EXACT_APPLY'; $reason='Exact mode is exposed but ChangeDisplaySettingsEx did not apply successfully.'
          } else {
            $verdict='FAIL_TOPOLOGY'; $reason='Exact mode was exposed/applied but never became an active Windows screen.'
          }

          $fo = Join-Path $env:PROBE_DIR '09-final.txt'
          "RESULT=$verdict" | Set-Content $fo
          "REASON=$reason" | Add-Content $fo
          "CONFIG_OK=$configOk DOWNLOAD_OK=$downloadOk INSTALL_EXIT=$installExit" | Add-Content $fo
          "PNP_FOUND=$pnpFound PNP_PROBLEM=$pnpProblem PIPE_OK=$pipeOk" | Add-Content $fo
          "EXACT_EXPOSED=$exactExposed APPLY_OK=$applyOk ACTIVE_EXACT=$activeExact" | Add-Content $fo
          "Finished=$(Get-Date -Format o)" | Add-Content $fo
          Get-Content $fo

          "## PrivateRDP VDD Probe v0.2 - ${{ matrix.os }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Requested: **${w} x ${h} @ ${hz} Hz**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Result: **$verdict**" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Reason: $reason" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Config=$configOk, download=$downloadOk, installExit=$installExit, PnP=$pnpFound, ProblemCode=$pnpProblem, pipe=$pipeOk, exact=$exactExposed, apply=$applyOk, active=$activeExact" | Add-Content $env:GITHUB_STEP_SUMMARY
          "This v0.2 probe intentionally exits 0 so the artifact is always complete." | Add-Content $env:GITHUB_STEP_SUMMARY

          # Prevent a harmless native-command LASTEXITCODE from making the whole
          # step fail after evidence has been collected.
          $global:LASTEXITCODE = 0
          exit 0

      - name: Upload complete probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vdd-probe-v02-${{ matrix.os }}
          path: ${{ github.workspace }}\vdd-probe-v02
          if-no-files-found: error
          retention-days: 7
