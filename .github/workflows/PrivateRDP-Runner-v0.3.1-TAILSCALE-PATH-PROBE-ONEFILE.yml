name: Start PrivateRDP TAILSCALE-PATH-PROBE ONEFILE

on:
  workflow_dispatch:
    inputs:
      room_code:
        description: "Room code used by your PrivateRDP APK"
        required: true
        default: "PRIVATE-RDP-2026"
      keep_minutes:
        description: "How long to keep the runner alive"
        required: true
        type: choice
        options: ['60', '180', '330']
        default: '330'
      phone_tailnet_ip:
        description: "Optional Android Tailscale 100.x IP; leave blank to auto-detect the only online Android peer"
        required: false
        default: ""
      audio:
        description: "Enable desktop audio (experimental)"
        type: boolean
        required: false
        default: false

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 355
    permissions:
      contents: read
    env:
      RDP_SIGNAL_URL: wss://universal-usb-signal.reiseakari.workers.dev/ws
      RDP_ROOM: ${{ inputs.room_code }}
      RDP_KEEP_MINUTES: ${{ inputs.keep_minutes }}
      RDP_PHONE_TAILSCALE_IP: ${{ inputs.phone_tailnet_ip }}
      RDP_RUNNER_PACKAGE: onefile-v0.3.1

